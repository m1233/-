<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حقوق الطفل: يوم سعيد لكل طفل</title>
<style>
@font-face { font-family: "Cairo"; src: url("../assets/Cairo-Variable.ttf"); font-weight: 200 1000; }
@font-face { font-family: "Kufi"; src: url("../assets/ReemKufi-Variable.ttf"); font-weight: 400 700; }
:root { --blue: #8EC8FF; --pink: #FFB8DE; --yellow: #FFE58A; --ink: #2B2A5E; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FBF8F1; }
body { font-family: "Cairo", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
canvas.full { position: absolute; left: 0; top: 0; }
#world { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0; }
.grp { position: absolute; width: 1080px; height: 1920px; }
.abs { position: absolute; }
.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 70%; }
svg { overflow: visible; display: block; }
.ico { display: inline-block; vertical-align: middle; }
.ico svg { width: 100%; height: 100%; }
.glassL { background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.78)); border: 3px solid rgba(255,255,255,.95);
  box-shadow: 0 22px 60px rgba(90,80,160,.18), 0 4px 0 rgba(142,200,255,.35), inset 0 0 0 1px rgba(142,200,255,.35); }
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 8px 30px 12px; border-radius: 999px; white-space: nowrap; font-weight: 800; }
/* 3D geometric kufi lettering */
.k3d { font-family: "Kufi"; font-weight: 700; white-space: nowrap; line-height: 1.3; }
.k3d.b { color: #4BA3F5; text-shadow: 0 2px 0 #2E78C8, 0 4px 0 #2E78C8, 0 6px 0 #2A6DB8, 0 8px 0 #2A6DB8, 0 10px 0 #245FA0, 0 18px 24px rgba(40,60,120,.28); }
.k3d.p { color: #F77FB9; text-shadow: 0 2px 0 #D45C97, 0 4px 0 #D45C97, 0 6px 0 #C2508A, 0 8px 0 #C2508A, 0 10px 0 #A8437A, 0 18px 24px rgba(120,40,90,.28); }
.k3d.y { color: #F7C531; text-shadow: 0 2px 0 #D9A21A, 0 4px 0 #D9A21A, 0 6px 0 #C58F12, 0 8px 0 #C58F12, 0 10px 0 #A87808, 0 18px 24px rgba(120,90,20,.28); }
.k3d.n { color: #3B3A78; text-shadow: 0 2px 0 #C9C6EA, 0 4px 0 #BDB9E2, 0 10px 18px rgba(60,50,120,.22); }
#cap { position: absolute; left: 44px; top: 1236px; width: 992px; min-height: 236px; border-radius: 44px; padding: 26px 40px 26px; }
#capWords { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px; padding-left: 196px; min-height: 184px; }
.tok { position: relative; display: inline-block; font-family: "Cairo"; font-size: 58px; font-weight: 900; line-height: 1.3; }
#final { position: absolute; inset: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" id="defs"></svg>
<div id="stage">
  <canvas id="bg" class="full" width="1080" height="1920"></canvas>
  <div id="world"></div>
  <div id="ov"></div>
  <canvas id="fx" class="full" width="1080" height="1920"></canvas>
  <div id="ov2" class="abs" style="inset:0"></div>
  <div id="final"></div>
  <div id="black" class="abs" style="inset:0;background:#FBF8F1;opacity:0"></div>
</div>
<script src="lib.js"></script>
<script>
"use strict";
/* ============================================================
   Child Rights Day — magical flying-island game (7:00, 9:16)
   Bright off-white world, pastel blue / pink / yellow, 3D kufi
   kinetic type, Halai (ElevenLabs) voice + SFX, own music.
   ============================================================ */
const CH = Object.fromEntries(TL.chunks.map(c => [c.level, c]));
const SC = { S0: 0, S1: 60, S2: 105, S3: 150, S4: 195, D1: 240, D2: 280, D3: 320, WIN: 360, FIN: 400 };
const LVL = ["S1", "S2", "S3", "S4"];
const UNLOCK = LVL.map(k => CH[k].end + 2.0);
const SET = { S0: [540, 960], S1: [1940, 960], S2: [3340, 960], S3: [3340, -1100], S4: [4740, -1100], D1a: [540, 3300], D1b: [1940, 3300], D2: [3340, 3300], D3: [4740, 3300] };
const BL = "#8EC8FF", PKc = "#FFB8DE", YL = "#FFE58A";

/* ---------------- background: off-white with faint golden magic dust ---------------- */
const bg = $("#bg").getContext("2d");
const dust = Array.from({ length: 150 }, (_, i) => ({ x: hash(i, 1) * W, y: hash(i, 2) * H, r: .8 + Math.pow(hash(i, 3), 2) * 3.2, z: .2 + hash(i, 4) * .8, ph: hash(i, 5) * 6.28, star: hash(i, 6) < .28 }));
function drawBG(t, cam, ctx = bg, slow = 1) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#FDFBF6"); g.addColorStop(.6, "#FBF8F1"); g.addColorStop(1, "#F6F2FB");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  [[200, 420, "142,200,255", .16, 620], [900, 1150, "255,184,222", .16, 660], [520, 1750, "255,229,138", .16, 600]].forEach(([x, y, c, a, r], i) => {
    const xx = x + Math.sin(t * .06 * slow + i) * 60, yy = y + Math.cos(t * .05 * slow + i) * 50;
    const rg = ctx.createRadialGradient(xx, yy, 10, xx, yy, r); rg.addColorStop(0, `rgba(${c},${a})`); rg.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  });
  for (const s of dust) {
    const x = ((s.x - cam.x * .05 * s.z * cam.z + Math.sin(t * .2 * slow + s.ph) * 14) % W + W) % W;
    const y = ((s.y - cam.y * .05 * s.z * cam.z - t * 5 * s.z * slow) % H + H) % H;
    const tw = Math.pow(Math.abs(Math.sin(t * (.6 + s.z) * slow + s.ph)), 3);
    ctx.globalAlpha = (.2 + .8 * tw) * (.35 + .65 * s.z);
    if (s.star) {
      const r = s.r * 3 * (.6 + .6 * tw); ctx.fillStyle = "#F5C842";
      ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
    } else { ctx.fillStyle = "#F7D46A"; ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.283); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

/* ---------------- camera ---------------- */
const K = [];
(function () {
  const at = (k, dx = 0, dy = 0) => [SET[k][0] + dx, SET[k][1] + dy];
  const push = (t, xy, z) => K.push([t, xy[0], xy[1], z]);
  push(0, at("S0", 0, 120), 1.25); push(4, at("S0"), 1.0); push(27.5, at("S0", 0, -20), 1.05);
  [[29.5, -260, -170], [35.5, -90, -200], [41.5, 110, -220], [47.5, 290, -170]].forEach(([t, dx, dy]) => { push(t, at("S0", dx, dy), 1.75); push(t + 4.2, at("S0", dx * 1.05, dy), 1.8); });
  push(55.5, at("S0"), .95);
  const seq = [["S1", 60, 105], ["S2", 105, 150], ["S3", 150, 195], ["S4", 195, 240]];
  let prev = "S0";
  seq.forEach(([k, a, b]) => {
    push(a - 2.2, [(SET[prev][0] + SET[k][0]) / 2, (SET[prev][1] + SET[k][1]) / 2], .66);
    push(a, at(k, 0, -60), 1.0); push(a + 3, at(k, 0, -20), 1.02); push(CH[k].end, at(k, 0, 30), 1.1); push(b - 4, at(k, 0, 60), 1.03);
    prev = k;
  });
  push(237.5, [2600, 1100], .3);
  push(240, at("D1a", 0, -40), 1.0); push(256.5, at("D1a", 0, 20), 1.08);
  push(258, at("D1b", 0, -30), 1.0); push(278, at("D1b", 0, 30), 1.07);
  push(280, at("D2", 0, -30), 1.0); push(318, at("D2", 0, 30), 1.08);
  push(320, at("D3", 0, -30), 1.0); push(357.5, at("D3", 0, 40), 1.08);
  push(360.5, [2640, 1100], .28); push(420, [2640, 1080], .27);
  K.sort((a, b) => a[0] - b[0]);
})();
function camAt(t) {
  let i = 0; while (i < K.length - 2 && t >= K[i + 1][0]) i++;
  const a = K[i], b = K[i + 1], k = E.io(prog(t, a[0], b[0]));
  return { x: lerp(a[1], b[1], k) + Math.sin(t * .55) * 5, y: lerp(a[2], b[2], k) + Math.cos(t * .43) * 6, z: Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), k)) };
}

/* ---------------- world sets ---------------- */
const world = $("#world");
function set(k, from, to) {
  const [x, y] = SET[k], g = el("div", { class: "grp", style: `left:${x - 540}px;top:${y - 960}px` }, world);
  on((t, cam) => { const vis = t >= from && t <= to && Math.abs(cam.x - x) < 1250 / cam.z && Math.abs(cam.y - y) < 1700 / cam.z; g.style.display = vis ? "block" : "none"; });
  return g;
}
function layer(g, t0, i) {
  const L = el("div", { class: "layer" }, g), tt0 = t0 + i * .25;
  on(t => { const k = prog(t, tt0, tt0 + .9), e = E.back(k);
    tf(L, `perspective(1600px) translateY(${(1 - E.out(k)) * 120}px) rotateX(${(1 - e) * 75}deg) scale(${lerp(.75, 1, E.out(k))})`); L.style.opacity = clamp(k * 3); });
  return L;
}
const softShadow = (cx, cy, rx, ry, o = .22) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#shadow)" opacity="${o * 2}"/>`;
const sparkle = (r, c = "#F5C842") => `<path d="M0 ${-r} Q0 0 ${r} 0 Q0 0 0 ${r} Q0 0 ${-r} 0 Q0 0 0 ${-r}Z" fill="${c}"/>`;
function kidFace(cx, cy, r, hair, girl) { // laughing child face for bubbles
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#skin)"/>${girl ? `<circle cx="${cx - r * .95}" cy="${cy - r * .1}" r="${r * .35}" fill="${hair}"/><circle cx="${cx + r * .95}" cy="${cy - r * .1}" r="${r * .35}" fill="${hair}"/>` : ""}
    <path d="M${cx - r} ${cy - r * .05} C${cx - r * 1.05} ${cy - r * 1.25},${cx + r * 1.05} ${cy - r * 1.25},${cx + r} ${cy - r * .05} C${cx + r * .7} ${cy - r * .55},${cx - r * .3} ${cy - r * .7},${cx - r} ${cy - r * .05}Z" fill="${hair}"/>
    <path d="M${cx - r * .5} ${cy + r * .02} q${r * .17} ${-r * .2} ${r * .34} 0 M${cx + r * .16} ${cy + r * .02} q${r * .17} ${-r * .2} ${r * .34} 0" stroke="#3A2416" stroke-width="${r * .09}" fill="none" stroke-linecap="round"/>
    <path d="M${cx - r * .38} ${cy + r * .3} Q${cx} ${cy + r * .85} ${cx + r * .38} ${cy + r * .3}Z" fill="#9C3346"/><path d="M${cx - r * .2} ${cy + r * .58} Q${cx} ${cy + r * .72} ${cx + r * .2} ${cy + r * .58}" fill="#F38C9C"/>
    <ellipse cx="${cx - r * .55}" cy="${cy + r * .32}" rx="${r * .18}" ry="${r * .1}" fill="#F7A0A8" opacity=".6"/><ellipse cx="${cx + r * .55}" cy="${cy + r * .32}" rx="${r * .18}" ry="${r * .1}" fill="#F7A0A8" opacity=".6"/>`;
}
function tree(x, y, s, g1 = "leaf") {
  return `<g transform="translate(${x},${y}) scale(${s})">${softShadow(0, 4, 90, 14)}<rect x="-16" y="-170" width="32" height="174" rx="12" fill="url(#wood)"/>
    ${[[-50, -210, 80], [40, -220, 85], [0, -280, 95], [-30, -330, 70], [45, -320, 66]].map(([a, b, r]) => `<circle cx="${a}" cy="${b}" r="${r}" fill="url(#${g1})"/>`).join("")}
    ${[[-60, -240, 26], [20, -310, 22], [50, -240, 20]].map(([a, b, r]) => `<circle cx="${a}" cy="${b}" r="${r}" fill="#fff" opacity=".18"/>`).join("")}</g>`;
}
function palm(x, y, s) {
  const seg = Array.from({ length: 9 }, (_, i) => { const k = i / 8; return `<ellipse cx="${Math.sin(k * 1.4) * 40}" cy="${-k * 330}" rx="${20 - k * 6}" ry="22" fill="url(#wood)"/>`; }).join("");
  return `<g transform="translate(${x},${y}) scale(${s})">${softShadow(0, 6, 70, 12)}${seg}<g class="fr" transform="translate(40,-335)">${[-160, -120, -70, -20, 30, 80, 130].map((a, i) => `<path d="M0 0 C 60 -46, 140 -34, 196 22 C 150 4, 80 6, 0 0Z" fill="url(#${i % 2 ? "leaf" : "leafD"})" transform="rotate(${a})"/>`).join("")}
    <circle cx="-12" cy="14" r="16" fill="url(#wood)"/><circle cx="14" cy="18" r="16" fill="url(#wood)"/></g></g>`;
}
function schoolBuilding(x, y, s) { // y = ground
  return `<g transform="translate(${x},${y}) scale(${s})">${softShadow(0, 6, 380, 34)}
    <rect x="-360" y="-300" width="720" height="300" rx="10" fill="url(#wall)"/><rect x="-360" y="-300" width="720" height="26" fill="#fff" opacity=".5"/>
    <rect x="-130" y="-470" width="260" height="470" rx="10" fill="url(#wall)"/><path d="M-160 -470 L0 -580 L160 -470Z" fill="url(#shirtPink)"/><path d="M0 -580 L160 -470 L180 -480Z" fill="#000" opacity=".12"/>
    <path d="M-390 -300 L-360 -340 L-130 -340 L-130 -300Z M390 -300 L360 -340 L130 -340 L130 -300Z" fill="url(#shirtPink)"/>
    <circle cx="0" cy="-400" r="54" fill="#fff"/><circle cx="0" cy="-400" r="48" fill="url(#page)"/><g id="clk"><line x1="0" y1="-400" x2="0" y2="-436" stroke="#3B3A78" stroke-width="7" stroke-linecap="round"/><line x1="0" y1="-400" x2="24" y2="-400" stroke="#3B3A78" stroke-width="7" stroke-linecap="round"/></g>
    <line x1="0" y1="-580" x2="0" y2="-680" stroke="#8C95A6" stroke-width="7"/><path class="flag" fill="url(#shirtYellow)"/>
    ${[-300, -210, 150, 240].map(xx => `<rect x="${xx}" y="-250" width="62" height="74" rx="8" fill="url(#window)"/><rect x="${xx}" y="-140" width="62" height="74" rx="8" fill="url(#window)"/><rect x="${xx}" y="-250" width="62" height="10" fill="#fff" opacity=".5"/><rect x="${xx}" y="-140" width="62" height="10" fill="#fff" opacity=".5"/>`).join("")}
    <path d="M-70 0 V-160 Q0 -230 70 -160 V0Z" fill="url(#door)"/><path d="M0 -205 V0" stroke="#fff" stroke-width="5" opacity=".6"/>
    <rect x="-110" y="-12" width="220" height="16" rx="6" fill="#E6E2F2"/><rect x="-130" y="2" width="260" height="14" rx="6" fill="#D9D4EC"/>
    <circle cx="0" cy="-160" r="160" fill="url(#glowY)" opacity=".35"/></g>`;
}
function bed(x, y, s, blanket = "shirtBlue") {
  return `<g transform="translate(${x},${y}) scale(${s})">${softShadow(0, 6, 260, 26)}<rect x="-250" y="-210" width="40" height="210" rx="14" fill="url(#wood)"/><rect x="210" y="-150" width="40" height="150" rx="14" fill="url(#wood)"/>
    <rect x="-220" y="-110" width="440" height="80" rx="18" fill="#fff"/><path d="M-220 -100 Q0 -150 220 -100 V-30 H-220Z" fill="url(#${blanket})"/>
    <rect x="-212" y="-150" width="110" height="48" rx="22" fill="#FFF7EC"/><rect x="-230" y="-30" width="460" height="22" rx="8" fill="url(#wood)"/></g>`;
}
function sofa(x, y, s) {
  return `<g transform="translate(${x},${y}) scale(${s})">${softShadow(0, 4, 300, 26)}<rect x="-280" y="-220" width="560" height="140" rx="50" fill="url(#shirtPurple)"/><rect x="-300" y="-140" width="600" height="110" rx="40" fill="url(#shirtPurple)"/>
    <rect x="-330" y="-180" width="80" height="170" rx="36" fill="url(#shirtPurple)"/><rect x="250" y="-180" width="80" height="170" rx="36" fill="url(#shirtPurple)"/>
    <rect x="-240" y="-200" width="110" height="80" rx="24" fill="url(#shirtYellow)"/><rect x="130" y="-200" width="110" height="80" rx="24" fill="url(#shirtPink)"/></g>`;
}
function fireplace(x, y, s) {
  return `<g transform="translate(${x},${y}) scale(${s})">${softShadow(0, 4, 230, 20)}<rect x="-220" y="-330" width="440" height="330" rx="12" fill="#D9CFC4"/>
    ${Array.from({ length: 5 }, (_, r) => Array.from({ length: 4 }, (_, c) => `<rect x="${-210 + c * 108 + (r % 2) * 50}" y="${-320 + r * 64}" width="96" height="54" rx="8" fill="#E8E0D6" opacity=".9"/>`).join("")).join("")}
    <rect x="-250" y="-360" width="500" height="40" rx="10" fill="url(#wood)"/><path d="M-130 0 V-150 Q0 -230 130 -150 V0Z" fill="#2B2230"/>
    <g id="fire"><path class="fl1" fill="#FF9A3C"/><path class="fl2" fill="#FFD36A"/></g><circle cx="0" cy="-60" r="230" fill="url(#glowY)" opacity=".55" class="fglow"/></g>`;
}
function windowNight(x, y, w, h, day) {
  return `<g transform="translate(${x},${y})"><rect x="-10" y="-10" width="${w + 20}" height="${h + 20}" rx="18" fill="#fff"/><rect x="0" y="0" width="${w}" height="${h}" rx="10" fill="url(#${day ? "wall" : "orbDeep"})"/>
    ${day ? `<circle cx="${w * .7}" cy="${h * .45}" r="${h * .2}" fill="url(#glowY)"/><circle cx="${w * .7}" cy="${h * .45}" r="${h * .12}" fill="#FFD36A"/>` : `<circle cx="${w * .7}" cy="${h * .35}" r="${h * .12}" fill="#FFF3C4"/>${[[.2, .3], [.35, .6], [.5, .2], [.15, .75]].map(([a, b]) => `<circle cx="${w * a}" cy="${h * b}" r="3" fill="#fff"/>`).join("")}`}
    <path d="M${w / 2} 0 V${h} M0 ${h / 2} H${w}" stroke="#fff" stroke-width="8"/></g>`;
}
function room(wallTop, wallBot) {
  return `<defs><linearGradient id="rw${FIG}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${wallTop}"/><stop offset="1" stop-color="${wallBot}"/></linearGradient></defs>
    <rect x="40" y="340" width="1000" height="860" rx="40" fill="url(#rw${FIG})"/><path d="M40 1040 H1040 V1160 Q1040 1200 1000 1200 H80 Q40 1200 40 1160Z" fill="#E9D6C2"/>
    <path d="M40 1040 H1040" stroke="#fff" stroke-width="6" opacity=".7"/><rect x="40" y="340" width="1000" height="860" rx="40" fill="none" stroke="#fff" stroke-width="10"/>`;
}

/* ===== S0: flying island with the four landmarks ===== */
function setS0() {
  const g = set("S0", 0, 60), L0 = layer(g, .3, 0), L1 = layer(g, .3, 1), L2 = layer(g, .3, 2);
  svgEl(L0, 1080, 1920, `${cloudPuffs(170, 1240, 380, .95)}${cloudPuffs(910, 1210, 360, .95)}${floatingRock(540, 900, 940)}${cloudPuffs(540, 1360, 520, .9)}`, "left:0;top:0");
  svgEl(L1, 1080, 1920, `${schoolBuilding(270, 890, .3)}${palm(420, 885, .55)}${palm(470, 880, .42)}
    <g transform="translate(640,885)"><path d="M-70 0 L-40 -190 L40 -190 L70 0" fill="none" stroke="url(#shirtBlue)" stroke-width="12"/><line x1="-30" y1="-185" x2="-30" y2="-60" stroke="#9AA3B8" stroke-width="3"/><line x1="30" y1="-185" x2="30" y2="-60" stroke="#9AA3B8" stroke-width="3"/><rect x="-42" y="-64" width="84" height="12" rx="5" fill="url(#wood)"/></g>
    <g transform="translate(830,885) scale(1.15)">${iconG("house", 0, -80, .85)}</g>
    ${tree(120, 890, .32)}${tree(960, 890, .3, "leafD")}`, "left:0;top:0");
  const lab = [["المستوى 1", 270, 29.5], ["المستوى 2", 440, 35.5], ["المستوى 3", 640, 41.5], ["المستوى 4", 830, 47.5]].map(([n, x, t0]) => {
    const d = el("div", { class: "abs", style: `left:${x}px;top:610px` }, L2, `<div class="pill glassL" style="font-size:30px;color:#3B3A78">${icon("lock", 34)}${n}</div>`);
    on(t => { const k = popScale(t, t0 + .4, .6); d.style.opacity = clamp(prog(t, t0 + .4, t0 + .8)); tf(d, `translate(-50%,-50%) scale(${k * .9})`); });
    return d;
  });
  const sp = svgEl(L2, 1080, 1920, Array.from({ length: 18 }, () => `<g class="s">${sparkle(14)}</g>`).join(""), "left:0;top:0");
  on(t => {
    if (g.style.display === "none") return;
    tf(L1, `${L1.style.transform} translateY(${Math.sin(t * 1.1) * 8}px)`);
    sp.querySelectorAll(".s").forEach((s, i) => { const ph = (t * .25 + i / 18) % 1; s.setAttribute("transform", `translate(${120 + (i * 53) % 840},${900 - ph * 600}) scale(${Math.sin(ph * Math.PI)})`); });
  });
}
/* ===== S1: school of knowledge ===== */
function setS1() {
  const s0 = SC.S1, g = set("S1", s0 - 4, s0 + 47), L0 = layer(g, s0 + .3, 0), L1 = layer(g, s0 + .3, 1), L2 = layer(g, s0 + .3, 2);
