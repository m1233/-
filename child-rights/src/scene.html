<!doctype html>
<html lang="ar" dir="rtl">
<head>

<style>

@font-face { font-family: "Kufi"; src: url("../assets/fonts/ReemKufi-Variable.ttf"); font-weight: 400 700; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A0826; }
body { font-family: "Cairo", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
canvas.full { position: absolute; left: 0; top: 0; }
#world { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0; }
.grp { position: absolute; width: 1080px; height: 1920px; }
.abs { position: absolute; }
.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 75%; }
svg { overflow: visible; display: block; }
.ico { display: inline-block; vertical-align: middle; }
.ico svg { width: 100%; height: 100%; }
.glass { background: linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.05) 60%, rgba(255,255,255,.08));
  border: 2px solid rgba(255,255,255,.32); box-shadow: 0 18px 50px rgba(5,3,30,.55), inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 40px rgba(130,110,255,.12); }
.glassDark { background: linear-gradient(180deg, rgba(34,26,92,.86), rgba(16,12,52,.9));
  border: 2px solid rgba(255,255,255,.22); box-shadow: 0 24px 70px rgba(3,2,20,.6), inset 0 1px 0 rgba(255,255,255,.3); }
.goldText { background: linear-gradient(180deg, #FFF8D8 0%, #FFE07A 40%, #F2B640 70%, #FFC7DF 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 10px rgba(20,8,60,.6)) drop-shadow(0 0 24px rgba(255,200,120,.35)); }
.card3d { position: absolute; left: 540px; top: 0; padding: 30px 60px 38px; border-radius: 40px; text-align: center; white-space: nowrap; transform-origin: 50% 100%; }
.card3d::before { content: ""; position: absolute; inset: -2px; border-radius: 40px; padding: 2px;
  background: linear-gradient(120deg, #FFE07A, #FFB8DE 50%, #8EC8FF); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 8px 30px 12px; border-radius: 999px; white-space: nowrap; font-weight: 800; }
#dlg { position: absolute; left: 44px; top: 1222px; width: 992px; min-height: 246px; border-radius: 40px; padding: 30px 40px 28px; }
#dlgWords { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 18px; padding-left: 190px; min-height: 186px; }
.tok { position: relative; display: inline-block; font-size: 58px; font-weight: 800; line-height: 1.3; }
.tok .pts { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); font-size: 30px; font-weight: 800; color: #FFE07A; white-space: nowrap; direction: ltr; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
#hud { position: absolute; left: 0; top: 0; width: 1080px; height: 420px; }

</head>

<svg width="0" height="0" style="position:absolute" id="defs"></svg>
<div id="stage">
  <canvas id="bg" class="full" width="1080" height="1920"></canvas>

<script>
"use strict";
/* =========================================================================
   Deterministic motion engine — semi-realistic art direction.
   render(t) is a pure function of time.  TL = narration word timestamps,
   PLAN = cue sheet shared with the audio pipeline.
   ========================================================================= */
const TL = window.TL, P = window.PLAN;
const W = 1080, H = 1920, NS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, fi = .4, fo = .4) => prog(t, a, a + fi) * (1 - prog(t, b - fo, b));
const E = {
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  back: k => { const c = 1.4; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
  el: k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * 2.094) + 1,
};
const hash = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
const anims = []; const on = f => anims.push(f);
function el(tag, attrs = {}, parent, html) {
  const e = document.createElement(tag);
  for (const k in attrs) k === "style" ? e.style.cssText = attrs[k] : e.setAttribute(k, attrs[k]);
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function svgEl(parent, w, h, inner, style = "") {
  const d = el("div", { class: "abs", style }, parent);
  d.innerHTML = `<svg xmlns="${NS}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
  return d;
}
const tf = (e, s) => { e.style.transform = s; };
const op = (e, v) => { e.style.opacity = v; e.style.visibility = v <= 0.001 ? "hidden" : "visible"; };
const popScale = (t, t0, d = .6) => E.back(prog(t, t0, t0 + d));

function book3d(x, y, w, h, d, g) {

    <rect x="${x + 8}" y="${y + h * .3}" width="${w - 16}" height="${h * .12}" fill="#FFE7A0" opacity=".85"/><rect x="${x + 8}" y="${y + h * .62}" width="${w * .5}" height="${h * .08}" fill="#FFE7A0" opacity=".6"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h * .18}" fill="#fff" opacity=".18"/>`;
}

  orange: () => `${sh()}<circle cx="100" cy="108" r="66" fill="url(#orange)"/>${Array.from({ length: 22 }, (_, i) => `<circle cx="${100 + Math.cos(i * 2.4) * (12 + (i * 7) % 50)}" cy="${108 + Math.sin(i * 2.4) * (12 + (i * 7) % 50)}" r="1.8" fill="#8A3A00" opacity=".25"/>`).join("")}
    ${hl(74, 84, 14, 22)}<path d="M100 44 C112 26,140 26,150 36 C136 50,114 52,100 44Z" fill="url(#leaf)"/>`,

    ${Array.from({ length: 16 }, (_, i) => `<ellipse cx="${62 + (i % 4) * 25 + (Math.floor(i / 4) % 2) * 12}" cy="${88 + Math.floor(i / 4) * 22}" rx="2.6" ry="4" fill="#FFE38A" opacity=".9"/>`).join("")}${hl(70, 92, 9, 18, -20, .45)}
    <path d="M100 70 L80 50 L96 60 L100 38 L104 60 L120 50Z M70 66 Q100 56 130 66 Q100 80 70 66Z" fill="url(#leafD)"/>`,

  carrot: () => `${sh(100, 188, 34, 7)}<path d="M64 70 C80 62,120 62,136 70 L106 184 Q100 194 94 184Z" fill="url(#carrot)"/>

    <path d="M100 68 C90 40,74 26,64 22 C84 32,96 46,100 66 C104 40,114 22,126 12 C116 34,108 50,104 68 C118 48,136 40,150 40 C134 48,118 58,106 70Z" fill="url(#leaf)"/>`,
