<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رحلة استكشاف الحقوق — يوم الطفل</title>
<style>
@font-face { font-family: "Lalezar"; src: url("../assets/fonts/Lalezar-Regular.ttf"); }
@font-face { font-family: "Baloo"; src: url("../assets/fonts/BalooBhaijaan2-Variable.ttf"); font-weight: 400 800; }
@font-face { font-family: "Kufi"; src: url("../assets/fonts/ReemKufi-Variable.ttf"); font-weight: 400 700; }
:root { --yellow: #FFE14D; --pink: #FFB8DE; --blue: #5AB4FF; --mint: #7DF0C8; --ink: #1B1450; --white: #FFFFFF; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B0830; }
body { font-family: "Baloo", "Noto Color Emoji", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
canvas.full { position: absolute; left: 0; top: 0; }
#world { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0; }
.grp { position: absolute; width: 1080px; height: 1920px; }
.abs { position: absolute; }
.emo { font-family: "Noto Color Emoji"; line-height: 1; }
.game { font-family: "Lalezar", "Noto Color Emoji"; font-weight: 400; }
.ctr { transform: translate(-50%, -50%); }
.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 75%; }
svg { overflow: visible; display: block; }
#ov { position: absolute; inset: 0; }
.gtext { background: linear-gradient(180deg, #FFF7B0 0%, #FFE14D 45%, #FF9ED2 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 0 #5B2A86) drop-shadow(0 0 22px rgba(255,184,222,.55)); }
.card3d { position: absolute; left: 540px; padding: 26px 54px 34px; border-radius: 48px; text-align: center; white-space: nowrap;
  background: linear-gradient(160deg, rgba(76,52,190,.96), rgba(35,22,110,.96)); border: 6px solid #FFE14D;
  box-shadow: 0 18px 0 #1A0F5C, 0 30px 80px rgba(0,0,0,.5), inset 0 0 40px rgba(255,184,222,.25); transform-origin: 50% 100%; }
.chip { display: inline-flex; align-items: center; gap: 14px; padding: 8px 30px 12px; border-radius: 999px; white-space: nowrap; font-weight: 800; }
/* dialog / kinetic reward words */
#dlg { position: absolute; left: 50px; top: 1218px; width: 980px; min-height: 250px; border-radius: 44px; padding: 34px 40px 30px 40px;
  background: linear-gradient(180deg, rgba(40,26,120,.88), rgba(22,14,70,.92)); border: 5px solid rgba(255,225,77,.85);
  box-shadow: 0 14px 0 rgba(15,8,50,.9), 0 0 60px rgba(255,184,222,.25); }
#dlgWords { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 18px; padding-right: 0; padding-left: 170px; min-height: 180px; }
.tok { position: relative; display: inline-block; font-size: 60px; font-weight: 800; line-height: 1.25; }
.tok .pts { position: absolute; left: 50%; top: -18px; transform: translateX(-50%); font-family: "Lalezar"; font-size: 34px; color: #FFE14D; white-space: nowrap; text-shadow: 0 2px 0 #5B2A86; }
#guide { position: absolute; left: 34px; top: 1100px; width: 220px; height: 260px; }
#hud { position: absolute; left: 0; top: 0; width: 1080px; height: 420px; }
.slot { position: absolute; width: 104px; height: 104px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 58px;
  background: rgba(20,12,70,.8); border: 5px solid rgba(255,255,255,.35); }
#final { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="full" width="1080" height="1920"></canvas>
  <div id="world"></div>
  <div id="ov"></div>
  <canvas id="fx" class="full" width="1080" height="1920"></canvas>
  <div id="ov2" class="abs" style="inset:0"></div>
  <div id="final"></div>
  <div id="black" class="abs" style="inset:0;background:#000;opacity:0"></div>
</div>
<script>
"use strict";
/* =========================================================================
   Deterministic motion engine. Every frame is a pure function render(t).
   TL   = narration word timestamps; PLAN = scene cue sheet (shared with audio).
   ========================================================================= */
const TL = window.TL, P = window.PLAN;
const W = 1080, H = 1920, NS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, fi = .4, fo = .4) => prog(t, a, a + fi) * (1 - prog(t, b - fo, b));
const E = {
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  back: k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
  el: k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * 2.094) + 1,
};
const hash = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
const anims = []; const on = f => anims.push(f);
function el(tag, attrs = {}, parent, html) {
  const e = document.createElement(tag);
  for (const k in attrs) k === "style" ? e.style.cssText = attrs[k] : e.setAttribute(k, attrs[k]);
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function svgEl(parent, w, h, inner, style = "") {
  const d = el("div", { class: "abs", style }, parent);
  d.innerHTML = `<svg xmlns="${NS}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
  return d;
}
const tf = (e, s) => { e.style.transform = s; };
const op = (e, v) => { e.style.opacity = v; e.style.visibility = v <= 0.001 ? "hidden" : "visible"; };
function popScale(t, t0, d = .55) { return E.back(prog(t, t0, t0 + d)); }

/* ---------- palette & geometry ---------- */
const Y = "#FFE14D", PK = "#FFB8DE", BL = "#5AB4FF", MI = "#7DF0C8", IN = "#1B1450", WH = "#FFFFFF";
const I = [[540, 960], [540, 3560], [2140, 3560], [2140, 960], [3740, 960]];
const MAP = [2140, 2260, .245];
const LV = P.levels, ST = P.start;

/* =========================== BACKGROUND =========================== */
const bg = $("#bg").getContext("2d");
const stars = Array.from({ length: 230 }, (_, i) => ({ x: hash(i, 1) * W, y: hash(i, 2) * H, r: .6 + hash(i, 3) * 2.4, z: .15 + hash(i, 4) * .85, ph: hash(i, 5) * 6.28, c: hash(i, 6) }));
const PAL = { L0: ["#0B0830", "#251670"], L1: ["#0C1248", "#2B2F95"], L2: ["#062B3D", "#126C6A"], L3: ["#2A2B86", "#7476E0"], L4: ["#151142", "#46307E"], MAP: ["#0B0830", "#2A1A78"] };
function hex2(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mixc(a, b, k) { const A = hex2(a), B = hex2(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(",")})`; }
function palette(t) {
  const seg = [[0, "L0"], [33.5, "MAP"], [58.5, "L1"], [137.5, "L2"], [217.5, "L3"], [297.5, "L4"], [377.5, "MAP"]];
  let i = 0; while (i < seg.length - 1 && t >= seg[i + 1][0]) i++;
  const cur = PAL[seg[i][1]], prev = i ? PAL[seg[i - 1][1]] : cur, k = E.io(prog(t, seg[i][0], seg[i][0] + 2.5));
  return [mixc(prev[0], cur[0], k), mixc(prev[1], cur[1], k)];
}
function drawBG(t, cam) {
  const [c0, c1] = palette(t);
  const g = bg.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c0); g.addColorStop(1, c1);
  bg.fillStyle = g; bg.fillRect(0, 0, W, H);
  // soft nebulae
  [[260, 520, PK, .16], [860, 1300, BL, .16], [600, 1700, "#B28DFF", .12]].forEach(([x, y, c, a], i) => {
    const xx = x + Math.sin(t * .1 + i) * 60 - cam.x * .02, yy = y + Math.cos(t * .08 + i) * 50;
    const rg = bg.createRadialGradient(xx, yy, 10, xx, yy, 620);
    rg.addColorStop(0, c + Math.round(a * 255).toString(16).padStart(2, "0")); rg.addColorStop(1, c + "00");
    bg.fillStyle = rg; bg.fillRect(0, 0, W, H);
  });
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const x = ((s.x - cam.x * .08 * s.z * cam.z + Math.sin(t * .05 + s.ph) * 10) % W + W) % W;
    const y = ((s.y - cam.y * .08 * s.z * cam.z - t * 4 * s.z) % H + H) % H;
    const tw = .45 + .55 * Math.abs(Math.sin(t * (.6 + s.z) + s.ph));
    bg.globalAlpha = tw * (.35 + .65 * s.z);
    bg.fillStyle = s.c < .15 ? Y : s.c < .3 ? PK : "#fff";
    bg.beginPath(); bg.arc(x, y, s.r * (s.z + .4), 0, 6.283); bg.fill();
    if (s.r > 2.4) { bg.fillRect(x - s.r * 3, y - .6, s.r * 6, 1.2); bg.fillRect(x - .6, y - s.r * 3, 1.2, s.r * 6); }
  }
  bg.globalAlpha = 1;
}

/* =========================== CAMERA =========================== */
const K = [];
(function buildCam() {
  K.push([0, 540, 1150, 1.28], [4, 540, 960, 1.0], [ST.narrStart, 540, 900, 1.02], [ST.mapIn, 540, 1000, 1.05],
    [ST.mapIn + 3.2, MAP[0], MAP[1], MAP[2]], [ST.dive, MAP[0] - 300, MAP[1] - 200, .27],
    [ST.dive + 2.2, 540, 1700, .62]);
  LV.forEach((l, k) => {
    const [x, y] = I[k + 1], S = l.S;
    K.push([S, x, y - 200, 1], [S + 5, x, y - 190, 1.02], [l.narrStart + 3, x, y - 60, 1.04], [l.narrEnd, x, y + 50, 1.06],
      [l.mission + 1.2, x, y + 150, .97], [l.complete, x, y + 110, 1.0], [l.leave, x, y + 20, 1.0]);
    if (k < 3) { const [nx, ny] = I[k + 2]; K.push([S + 77.8, (x + nx) / 2, (y + ny) / 2, .7]); }
  });
  K.push([P.win, MAP[0], MAP[1], MAP[2]], [P.final, MAP[0], MAP[1] - 60, .26], [420, MAP[0], MAP[1] - 80, .25]);
  K.sort((a, b) => a[0] - b[0]);
})();
function camAt(t) {
  let i = 0; while (i < K.length - 2 && t >= K[i + 1][0]) i++;
  const a = K[i], b = K[i + 1], k = E.io(prog(t, a[0], b[0]));
  const z = Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), k));
  return { x: lerp(a[1], b[1], k) + Math.sin(t * .6) * 5, y: lerp(a[2], b[2], k) + Math.cos(t * .45) * 7, z };
}
function applyCam(t) {
  const c = camAt(t);
  $("#world").style.transform = `translate(540px,960px) scale(${c.z}) translate(${-c.x}px,${-c.y}px)`;
  return c;
}

/* =========================== WORLD: islands =========================== */
const world = $("#world");
function island(k) {
  const [x, y] = I[k];
  const g = el("div", { class: "grp", style: `left:${x - 540}px;top:${y - 960}px` }, world);
  g.layers = [];
  return g;
}
function layer(g, t0, i) { // pop-up 3D layer (book pop-up)
  const L = el("div", { class: "layer" }, g);
  const tt0 = t0 + i * .28;
  on(t => {
    const k = prog(t, tt0, tt0 + .9), e = E.back(k);
    tf(L, `perspective(1500px) translateY(${(1 - E.out(k)) * 160}px) rotateX(${(1 - e) * 84}deg) scale(${lerp(.7, 1, E.out(k))})`);
    L.style.opacity = clamp(k * 3);
  });
  return L;
}
function visibleGroup(g, k, from, to) {
  on((t, cam) => {
    const [x, y] = I[k];
    const vis = t >= from && t <= to && cam.z > .45 && Math.abs(cam.x - x) < 1300 / cam.z && Math.abs(cam.y - y) < 1900 / cam.z;
    g.style.display = vis ? "block" : "none";
  });
}

/* ---------- Island 0 : magic portal ---------- */
function island0() {
  const g = island(0); visibleGroup(g, 0, 0, ST.dive + 3);
  const p = svgEl(g, 900, 900, `
    <defs><radialGradient id="pg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF6FF"/><stop offset=".35" stop-color="${PK}"/><stop offset=".7" stop-color="#7B5CFF" stop-opacity=".7"/><stop offset="1" stop-color="#3A1E9E" stop-opacity="0"/></radialGradient></defs>
    <g transform="translate(450,450)">
      <circle id="core" r="330" fill="url(#pg)"/>
      <g id="sw">${Array.from({ length: 6 }, (_, i) => `<path d="M0 0 C 80 -60, 200 -40, 280 40" fill="none" stroke="${i % 2 ? Y : WH}" stroke-opacity=".55" stroke-width="10" stroke-linecap="round" transform="rotate(${i * 60})"/>`).join("")}</g>
      <circle id="r1" r="360" fill="none" stroke="${Y}" stroke-width="14" stroke-dasharray="60 30"/>
      <circle id="r2" r="395" fill="none" stroke="${PK}" stroke-width="8" stroke-dasharray="20 26"/>
      <circle id="r3" r="425" fill="none" stroke="${BL}" stroke-width="6" stroke-dasharray="4 18" stroke-linecap="round"/>
      <g id="spk">${Array.from({ length: 10 }, (_, i) => `<path d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7Z" fill="${i % 2 ? Y : WH}"/>`).join("")}</g>
    </g>`, "left:90px;top:520px");
  const q = s => p.querySelector(s);
  on(t => {
    const o = E.out(prog(t, ST.portal, ST.portal + 2.6));
    q("#core").setAttribute("transform", `scale(${o * (1 + Math.sin(t * 2) * .03)})`);
    q("#sw").setAttribute("transform", `rotate(${t * 70}) scale(${o})`);
    q("#r1").setAttribute("transform", `rotate(${t * 25}) scale(${E.back(prog(t, ST.portal, ST.portal + 1.2))})`);
    q("#r2").setAttribute("transform", `rotate(${-t * 35}) scale(${E.back(prog(t, ST.portal + .3, ST.portal + 1.5))})`);
    q("#r3").setAttribute("transform", `rotate(${t * 15}) scale(${E.back(prog(t, ST.portal + .6, ST.portal + 1.8))})`);
    [...q("#spk").children].forEach((s, i) => {
      const a = t * .8 + i * .628, r = 450 + Math.sin(t * 2 + i) * 30;
      s.setAttribute("transform", `translate(${Math.cos(a) * r},${Math.sin(a) * r}) scale(${o * (.6 + .4 * Math.abs(Math.sin(t * 3 + i)))}) rotate(${t * 90})`);
    });
    p.style.opacity = prog(t, ST.portal - .2, ST.portal + .6);
  });
}

/* ---------- Island 1 : flying castle of books ---------- */
const BOOKC = ["#FF6B8B", "#5AB4FF", "#FFE14D", "#6EE7A8", "#B28DFF", "#FFB8DE", "#FF9F45"];
function bookStack(x, yBottom, w, n, seed) {
  let s = "", y = yBottom;
  for (let i = 0; i < n; i++) {
    const h = 34 + hash(i, seed) * 16, ww = w - hash(i, seed + 1) * 26, off = (hash(i, seed + 2) - .5) * 16;
    y -= h;
    const c = BOOKC[(i + seed) % BOOKC.length];
    s += `<rect x="${x - ww / 2 + off}" y="${y}" width="${ww}" height="${h - 3}" rx="8" fill="${c}" stroke="${IN}" stroke-width="4"/>
      <rect x="${x - ww / 2 + off + ww - 26}" y="${y + 6}" width="18" height="${h - 15}" rx="3" fill="#FFF8E7"/>
      <rect x="${x - ww / 2 + off + 14}" y="${y + h / 2 - 5}" width="${ww * .45}" height="5" rx="2" fill="${IN}" opacity=".35"/>`;
  }
  return { s, top: y };
}
function cloudPuffs(cx, cy, w, col = "#FFFFFF", op2 = 1) {
  const n = 7; let s = "";
  for (let i = 0; i < n; i++) { const x = cx - w / 2 + (i + .5) * w / n, r = w / n * (.9 + hash(i, cx) * .6); s += `<circle cx="${x}" cy="${cy - Math.sin(i / (n - 1) * Math.PI) * w * .08}" r="${r}" fill="${col}" opacity="${op2}"/>`; }
  return s + `<rect x="${cx - w / 2}" y="${cy}" width="${w}" height="${w * .1}" rx="${w * .05}" fill="${col}" opacity="${op2}"/>`;
}
function island1() {
  const l = LV[0], g = island(1); visibleGroup(g, 1, l.S - 3, l.next + .5);
  const L0 = layer(g, l.popup, 0), L1 = layer(g, l.popup, 1), L2 = layer(g, l.popup, 2);
  // base cloud + rock
  svgEl(L0, 1080, 1920, `<ellipse cx="540" cy="1250" rx="420" ry="70" fill="#000" opacity=".18"/>
    <path d="M200 1090 Q540 1420 880 1090 Z" fill="#6D4FD6" stroke="${IN}" stroke-width="6"/><path d="M260 1100 Q540 1330 820 1100" fill="none" stroke="#9C84FF" stroke-width="10" opacity=".7"/>
    ${cloudPuffs(540, 1090, 820, "#EDE7FF")}`, "left:0;top:0");
  // castle of books
  const t1 = bookStack(320, 1080, 190, 9, 3), t2 = bookStack(540, 1080, 250, 12, 7), t3 = bookStack(760, 1080, 190, 9, 11);
  const roof = (x, y, w, c) => `<path d="M${x - w / 2 - 16} ${y} L${x} ${y - w * .85} L${x + w / 2 + 16} ${y}Z" fill="${c}" stroke="${IN}" stroke-width="5" stroke-linejoin="round"/>
     <line x1="${x}" y1="${y - w * .85}" x2="${x}" y2="${y - w * .85 - 90}" stroke="${IN}" stroke-width="6"/>`;
  const cas = svgEl(L1, 1080, 1920, `${t1.s}${t2.s}${t3.s}${roof(320, t1.top, 190, PK)}${roof(540, t2.top, 250, BL)}${roof(760, t3.top, 190, PK)}
    <path d="M440 1080 V960 Q540 880 640 960 V1080Z" fill="#FFF8E7" stroke="${IN}" stroke-width="6"/><line x1="540" y1="912" x2="540" y2="1080" stroke="${IN}" stroke-width="5"/>
    <g id="flags">${[[320, t1.top - 161], [540, t2.top - 212], [760, t3.top - 161]].map(([x, y], i) => `<path data-x="${x}" data-y="${y - 90}" fill="${i === 1 ? Y : MI}" stroke="${IN}" stroke-width="4"/>`).join("")}</g>`, "left:0;top:0");
  const flags = [...cas.querySelectorAll("#flags path")];
  // flying telescopes, pencils, sparkles
  const tel = `<g><rect x="-70" y="-16" width="110" height="32" rx="10" fill="${BL}" stroke="${IN}" stroke-width="5"/><rect x="36" y="-22" width="34" height="44" rx="8" fill="${Y}" stroke="${IN}" stroke-width="5"/><line x1="-20" y1="16" x2="-40" y2="60" stroke="${IN}" stroke-width="6"/><line x1="-20" y1="16" x2="0" y2="60" stroke="${IN}" stroke-width="6"/></g>`;
  const pen = c => `<g><rect x="-60" y="-13" width="100" height="26" rx="4" fill="${c}" stroke="${IN}" stroke-width="5"/><path d="M40 -13 L70 0 L40 13Z" fill="#FFD9A8" stroke="${IN}" stroke-width="5" stroke-linejoin="round"/><rect x="-74" y="-13" width="16" height="26" rx="5" fill="${PK}" stroke="${IN}" stroke-width="5"/></g>`;
  const items = [tel, pen(Y), pen(MI), tel, pen(PK), pen(BL)];
  const fly = svgEl(L2, 1080, 1920, items.map((s, i) => `<g class="fi">${s}</g>`).join("") +
    Array.from({ length: 16 }, (_, i) => `<path class="st" d="M0 -18 L5 -5 L18 0 L5 5 L0 18 L-5 5 L-18 0 L-5 -5Z" fill="${Y}"/>`).join(""), "left:0;top:0");
  on(t => {
    if (g.style.display === "none") return;
    tf(cas, `translateY(${Math.sin(t * 1.2) * 14}px)`);
    flags.forEach((f, i) => { const x = +f.dataset.x, y = +f.dataset.y, w = Math.sin(t * 5 + i) * 10;
      f.setAttribute("d", `M${x} ${y} Q${x + 40} ${y - 12 + w} ${x + 80} ${y + w} Q${x + 40} ${y + 30 + w * .5} ${x} ${y + 40}Z`); });
    fly.querySelectorAll(".fi").forEach((e, i) => {
      const a = t * (.35 + i * .04) + i * 1.05, rx = 430, ry = 240;
      e.setAttribute("transform", `translate(${540 + Math.cos(a) * rx},${700 + Math.sin(a) * ry + Math.sin(t * 2 + i) * 20}) rotate(${Math.sin(t + i) * 25 + (Math.cos(a) > 0 ? 0 : 180)}) scale(${.9 + .25 * Math.sin(a)})`);
    });
    fly.querySelectorAll(".st").forEach((e, i) => {
      const ph = (t * .35 + i / 16) % 1, a = i * 2.4;
      e.setAttribute("transform", `translate(${540 + Math.cos(a) * (200 + ph * 300)},${760 - ph * 500 + Math.sin(a) * 100}) scale(${Math.sin(ph * Math.PI) * (.6 + hash(i) * .8)}) rotate(${t * 60})`);
      e.setAttribute("opacity", .5 + .5 * Math.sin(ph * Math.PI));
    });
  });
}

/* ---------- Island 2 : energy oasis ---------- */
function island2() {
  const l = LV[1], g = island(2); visibleGroup(g, 2, l.S - 3, l.next + .5);
  const L0 = layer(g, l.popup, 0), L1 = layer(g, l.popup, 1), L2 = layer(g, l.popup, 2);
  svgEl(L0, 1080, 1920, `<ellipse cx="540" cy="1150" rx="520" ry="200" fill="#3FBF7F" stroke="${IN}" stroke-width="6"/>
    <ellipse cx="540" cy="1110" rx="500" ry="170" fill="#5FD99A"/>
    <ellipse id="pond" cx="560" cy="1130" rx="200" ry="55" fill="#5AB4FF" stroke="${IN}" stroke-width="5"/>
    <ellipse id="rip" cx="560" cy="1130" rx="120" ry="30" fill="none" stroke="#fff" stroke-width="4" opacity=".6"/>
    ${[[150, 1060], [930, 1070], [300, 1190], [800, 1200]].map(([x, y]) => `<path d="M${x} ${y} q8 -40 16 0 q8 -50 16 0" fill="#2E9E62"/>`).join("")}`, "left:0;top:0");
  // palm trees

        y = ((tt * sp + hash(i, bi + 5) * 300) % 2200) - 150;
      } else {
        const a = hash(i, bi + 1) * 6.283, v = 900 + hash(i, bi + 2) * 1100;
        x = 540 + Math.cos(a) * v * dt * .55; y = 900 + Math.sin(a) * v * dt * .55 - 600 * dt + 700 * dt * dt;
      }
      const rot = dt * (3 + hash(i, 9) * 6) + i, flip = Math.cos(dt * (5 + hash(i, 11) * 5) + i);
      fx.save(); fx.translate(x, y); fx.rotate(rot); fx.scale(1, flip);
      fx.globalAlpha = fade; fx.fillStyle = CC[i % CC.length];
      if (i % 4 === 0) { fx.beginPath(); fx.arc(0, 0, 9, 0, 6.283); fx.fill(); } else fx.fillRect(-12, -6, 24, 12);
      fx.restore();
    }
  });
  fx.globalAlpha = 1;
}

/* ---------- map overlay text ---------- */
function mapTexts() {
  const t1 = el("div", { class: "abs chip game", style: "left:540px;top:420px;font-size:70px;color:#1B1450;background:linear-gradient(180deg,#FFF39A,#FFD21F);border:6px solid #fff;box-shadow:0 12px 0 #C77A00" }, ov, "🗺️ خريطة رحلة الحقوق");
  const t2 = el("div", { class: "abs chip game", style: "left:540px;top:1560px;font-size:64px;color:#fff;background:linear-gradient(180deg,#FF8FC8,#E2559B);border:6px solid #fff;box-shadow:0 10px 0 #9C2E6A" }, ov, "🔓 تم فتح المستوى 1!");
  const t3 = el("div", { class: "abs game", style: "left:540px;top:1560px;font-size:60px;color:#fff;white-space:nowrap;text-shadow:0 5px 0 #2A1A78" }, ov, "4 مستويات • 4 حقوق سحرية ✨");
  on(t => {
    const v = win(t, ST.mapIn + 2, ST.dive + .5, .5, .5);
    op(t1, v); tf(t1, `translate(-50%,-50%) scale(${popScale(t, ST.mapIn + 2, .6)})`);
    const v2 = win(t, ST.unlock1, ST.dive + .5, .4, .5); op(t2, v2); tf(t2, `translate(-50%,-50%) scale(${popScale(t, ST.unlock1, .6)})`);
    const v3 = win(t, ST.mapNodes[3] + 1, ST.unlock1 - .2, .5, .3); op(t3, v3); tf(t3, "translate(-50%,-50%)");
  });
}

/* ---------- win screen ---------- */
function winScreen() {
  const W0 = P.win, F = P.final;
  const box = el("div", { class: "abs", style: "inset:0" }, ov);
  const dim = el("div", { class: "abs", style: "inset:0;background:radial-gradient(circle at 50% 42%, rgba(60,30,140,.7), rgba(10,6,40,.92))" }, box);
  const star = svgEl(box, 520, 520, `<defs><radialGradient id="ws"><stop offset="0" stop-color="#FFF8C4"/><stop offset=".6" stop-color="${Y}"/><stop offset="1" stop-color="#FFB020"/></radialGradient></defs>
    <g transform="translate(260,260)"><g id="rays">${Array.from({ length: 16 }, (_, i) => `<path d="M-14 0 L0 -250 L14 0Z" fill="${i % 2 ? PK : Y}" opacity=".45" transform="rotate(${i * 22.5})"/>`).join("")}</g>
    <path d="M0 -170 L48 -58 L168 -52 L76 26 L106 144 L0 80 L-106 144 L-76 26 L-168 -52 L-48 -58Z" fill="url(#ws)" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="-36" cy="0" r="12" fill="${IN}"/><circle cx="36" cy="0" r="12" fill="${IN}"/><path d="M-30 34 Q0 64 30 34" fill="none" stroke="${IN}" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-62" cy="26" r="14" fill="${PK}"/><circle cx="62" cy="26" r="14" fill="${PK}"/></g>`, "left:280px;top:340px");
  const ICONS = ["🏫", "📚", "🎮", "🎈", "👨‍👩‍👧", "🏠", "🩺", "🍏"];
  const orb = ICONS.map(i => el("div", { class: "abs emo", style: "left:0;top:0;font-size:120px" }, box, i));
  const t1 = el("div", { class: "abs game gtext", style: "left:540px;top:930px;font-size:160px;white-space:nowrap" }, box, "تهانينا!");
  const t2 = el("div", { class: "abs game", style: "left:540px;top:1085px;font-size:84px;white-space:nowrap;color:#fff;text-shadow:0 6px 0 #5B2A86, 0 0 30px rgba(255,184,222,.8)" }, box, "أنت طفل رائع ومميز 🌟");
  on(t => {
    const v = win(t, W0 - .3, F + 1.6, .6, 1.6);
    box.style.display = v > 0 ? "block" : "none"; if (!v) return;
    op(box, v);
    const recede = E.io(prog(t, F - .2, F + 1.6));
    const sk = popScale(t, W0 + .2, .9);
    star.querySelector("#rays").setAttribute("transform", `rotate(${t * 20}) scale(${1 + .08 * Math.sin(t * 3)})`);
    tf(star, `translateY(${Math.sin(t * 2) * 14 - recede * 200}px) scale(${sk * (1 + .05 * Math.sin(t * 4)) * (1 - recede * .5)})`);
    orb.forEach((e, i) => {
      const a = t * .9 + i / ICONS.length * 6.283, depth = Math.sin(a);
      const r = popScale(t, W0 + .6 + i * .12, .6) * (1 - recede * .6);
      tf(e, `translate(${540 + Math.cos(a) * 420 * r - 60}px,${600 + depth * 150 * r - 60 - recede * 200}px) scale(${(.75 + .35 * (depth + 1) / 2) * r})`);
      e.style.zIndex = depth > 0 ? 3 : 0; e.style.opacity = (.55 + .45 * (depth + 1) / 2) * (1 - recede);
    });
    op(t1, (1 - recede)); tf(t1, `translate(-50%,-50%) scale(${popScale(t, W0 + 1.0, .8)}) rotate(${Math.sin(t * 2) * 2}deg)`);
    op(t2, (1 - recede)); tf(t2, `translate(-50%,-50%) scale(${popScale(t, W0 + 1.6, .8)})`);
    dim.style.opacity = 1 - recede * .3;
  });
}

/* ---------- final elegant card (off-white, silent voice) ---------- */
function finalCard() {
  const F = P.final, f = $("#final");
  const sky = el("canvas", { width: 1080, height: 1920, class: "full" }, f);
  const sc = sky.getContext("2d");
  const card = el("div", { class: "abs", style: "left:540px;top:960px;width:860px;padding:90px 60px 100px;border-radius:36px;text-align:center;background:#FFFDF8;border:3px solid #CDB27A;box-shadow:0 30px 90px rgba(120,90,40,.18), inset 0 0 0 14px #FFFDF8, inset 0 0 0 16px rgba(205,178,122,.7)" }, f);
  svgEl(card, 300, 60, `<path d="M0 30 H110 M190 30 H300" stroke="#CDB27A" stroke-width="3"/><path d="M150 4 L162 18 L180 18 L168 30 L180 42 L162 42 L150 56 L138 42 L120 42 L132 30 L120 18 L138 18Z" fill="none" stroke="#CDB27A" stroke-width="3"/><circle cx="150" cy="30" r="6" fill="#E9A6C6"/>`, "position:relative;margin:0 auto 34px;width:300px;height:60px");
  const a = el("div", { style: "font-family:Kufi;font-weight:500;font-size:70px;color:#9A7B45;letter-spacing:2px" }, card, "إعداد المعلمة");
  const b = el("div", { style: "font-family:Kufi;font-weight:700;font-size:140px;color:#1F2A5A;line-height:1.35;margin-top:10px" }, card, "فاطمة خلف");
  svgEl(card, 300, 60, `<path d="M0 30 H110 M190 30 H300" stroke="#CDB27A" stroke-width="3"/><path d="M150 4 L162 18 L180 18 L168 30 L180 42 L162 42 L150 56 L138 42 L120 42 L132 30 L120 18 L138 18Z" fill="none" stroke="#CDB27A" stroke-width="3"/><circle cx="150" cy="30" r="6" fill="#9ECDF5"/>`, "position:relative;margin:34px auto 0;width:300px;height:60px");
  const fs = Array.from({ length: 70 }, (_, i) => ({ x: hash(i, 21) * W, y: hash(i, 22) * H, r: 1.5 + hash(i, 23) * 4, ph: hash(i, 24) * 6.28, c: hash(i, 25) }));
  on(t => {
    const v = prog(t, F - .3, F + 1.4);
    op(f, v); if (!v) return;
    sc.fillStyle = "#FBF7EF"; sc.fillRect(0, 0, W, H);
    fs.forEach(s => {
      const x = s.x + Math.sin((t - F) * .08 + s.ph) * 30, y = (s.y - (t - F) * 6 + H) % H;
      sc.globalAlpha = .25 + .2 * Math.sin(t * .7 + s.ph);
      sc.fillStyle = s.c < .33 ? "#E3C98E" : s.c < .66 ? "#F2B8D2" : "#A9CDEF";
      sc.beginPath(); for (let k = 0; k < 10; k++) { const ang = k * Math.PI / 5 - Math.PI / 2, rr = k % 2 ? s.r * .45 : s.r * 1.6; sc.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); } sc.fill();
    });
    sc.globalAlpha = 1;
    const ck = E.out(prog(t, F + 1.2, F + 3.2));
    card.style.opacity = ck; tf(card, `translate(-50%,-50%) translateY(${(1 - ck) * 40}px) scale(${lerp(.96, 1, ck)})`);
    a.style.opacity = prog(t, F + 1.8, F + 3.2); b.style.opacity = prog(t, F + 2.4, F + 4.0);
    $("#black").style.opacity = E.io(prog(t, P.fadeOut, 420));
  });
}
