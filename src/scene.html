<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الكيمياء الصناعية — Motion Graphic</title>
<style>
@font-face { font-family: "Cairo"; src: url("../assets/fonts/Cairo-Variable.ttf") format("truetype"); font-weight: 200 1000; }
:root {
  --navy-0: #040B1E; --navy-1: #071634; --navy-2: #0C2452; --navy-3: #16397A;
  --green: #8CF5B0; --green-2: #4FE38A; --green-dim: rgba(140,245,176,.55);
  --orange: #FF9A3C; --orange-2: #FF7A1A; --white: #EAF6FF;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy-0); }
body { font-family: "Cairo", sans-serif; color: var(--green); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
#bg { position: absolute; inset: 0; }
#world { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0; will-change: transform; }
.grp { position: absolute; width: 1080px; height: 1920px; }
.abs { position: absolute; }
.center { transform: translate(-50%, -50%); }
.txt { text-align: center; line-height: 1.35; white-space: nowrap; }
.w { display: inline-block; will-change: transform, opacity; }
.glow { text-shadow: 0 0 28px rgba(140,245,176,.45), 0 0 4px rgba(140,245,176,.6); }
.oglow { color: var(--orange); text-shadow: 0 0 26px rgba(255,154,60,.55); }
.chip { display: inline-flex; align-items: center; gap: 14px; padding: 10px 30px; border-radius: 999px; font-weight: 800; white-space: nowrap; }
.chip.orange { background: rgba(40,22,8,.82); border: 3px solid var(--orange); color: var(--orange); box-shadow: 0 0 30px rgba(255,154,60,.35); }
.chip.green  { background: rgba(140,245,176,.10); border: 3px solid var(--green); color: var(--green); }
.card { position: absolute; left: 90px; top: 290px; width: 900px; height: 1100px; border-radius: 64px;
  background: linear-gradient(160deg, rgba(22,57,122,.85), rgba(7,22,52,.92));
  border: 3px solid rgba(140,245,176,.35); box-shadow: 0 40px 120px rgba(0,0,0,.55), inset 0 0 80px rgba(140,245,176,.06); }
.badge { position: absolute; width: 132px; height: 132px; border-radius: 50%; background: var(--orange); color: var(--navy-1);
  font-weight: 900; font-size: 78px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 50px rgba(255,154,60,.6); }
#overlay { position: absolute; inset: 0; pointer-events: none; }
#caption { position: absolute; left: 50%; top: 1488px; transform: translate(-50%, -50%); padding: 14px 40px; border-radius: 28px;
  background: rgba(4,11,30,.72); border: 2px solid rgba(140,245,176,.25); font-size: 46px; font-weight: 700; white-space: nowrap; color: rgba(234,246,255,.62); }
#caption .cw { display: inline-block; margin: 0 7px; }
#caption .cw.on { color: var(--green); text-shadow: 0 0 18px rgba(140,245,176,.6); }
#progress { position: absolute; right: 0; top: 0; height: 8px; background: linear-gradient(270deg, var(--green), var(--green-2)); box-shadow: 0 0 18px var(--green); }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
#flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(140,245,176,.5), rgba(140,245,176,0) 70%); opacity: 0; }
svg { overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="world"></div>
  <div id="overlay">
    <svg id="burst" class="abs" style="left:0;top:0" width="1080" height="1920"></svg>
    <div id="flash"></div>
    <div id="s3head" class="abs"></div>
    <div id="caption"></div>
    <div id="vignette"></div>
    <div id="progress"></div>
  </div>
</div>
<script>
"use strict";
/* =====================================================================
   Deterministic motion engine: every visual property is a pure function
   of time t (seconds). render(t) is called once per frame by the renderer.
   Text reveals are cued from the narration word timestamps (window.TL).
   ===================================================================== */
const TL = window.TL;
const W = 1080, H = 1920;
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  outQ: k => 1 - Math.pow(1 - k, 5),
  back: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  elastic: k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI / 3)) + 1,
};
const C = (id, i) => TL.chunks[id].words[i].t;          // cue: time word i of chunk id is spoken
const CD = (id, i) => TL.chunks[id].words[i].d;
const NS = "http://www.w3.org/2000/svg";
const anims = [];
const on = fn => anims.push(fn);
function el(tag, attrs = {}, parent, html) {
  const e = document.createElement(tag);
  for (const k in attrs) k === "style" ? (e.style.cssText = attrs[k]) : e.setAttribute(k, attrs[k]);
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function svg(parent, w, h, inner, style = "") {
  const d = el("div", { class: "abs", style }, parent);
  d.innerHTML = `<svg xmlns="${NS}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
  return d;
}
function group(x, y) { return el("div", { class: "grp", style: `left:${x}px;top:${y}px` }, $("#world")); }
function setT(e, s) { e.style.transform = s; }

/* --- popIn: generic appear animation (scale + fade) --- */
function pop(e, t0, base = "", dur = .55, ease = E.back) {
  on(t => {
    const k = prog(t, t0, t0 + dur);
    e.style.opacity = clamp(k * 2);
    setT(e, `${base} scale(${lerp(.3, 1, ease(k))})`);
  });
}
function fadeOut(e, t0, dur = .5) { on(t => { if (t > t0) e.style.opacity = Math.min(+e.style.opacity, 1 - prog(t, t0, t0 + dur)); }); }

/* --- Kinetic words: each word rises, de-blurs and fades in at its cue --- */
function words(parent, text, times, { x, y, size = 80, weight = 800, cls = "", color = "", dur = .45, stagger = .08 } = {}) {
  const box = el("div", { class: `abs txt ${cls}`, style: `left:${x}px;top:${y}px;font-size:${size}px;font-weight:${weight};${color ? "color:" + color : ""};transform:translate(-50%,-50%)` }, parent);
  const parts = text.split(" ");
  const spans = parts.map((p, i) => {
    const s = el("span", { class: "w" }, box, p);
    if (i < parts.length - 1) box.appendChild(document.createTextNode(" "));
    return s;
  });
  const ts = Array.isArray(times) ? times : parts.map((_, i) => times + i * stagger);
  on(t => spans.forEach((s, i) => {
    const k = prog(t, ts[i], ts[i] + dur), e = E.out(k);
    s.style.opacity = k;
    s.style.filter = k < 1 ? `blur(${(1 - e) * 10}px)` : "none";
    setT(s, `translateY(${(1 - e) * 46}px) scale(${lerp(.86, 1, E.back(k))})`);
  }));
  box.spans = spans; box.times = ts;
  return box;
}

/* ===================== SVG ICON LIBRARY ===================== */
const G = "#8CF5B0", G2 = "#4FE38A", O = "#FF9A3C", WH = "#EAF6FF", NV = "#071634", NB = "#16397A";
function molecule(r = 1) { // ball & stick molecule
  return `<g stroke="${WH}" stroke-opacity=".55" stroke-width="${7 * r}">
    <line x1="0" y1="0" x2="${-70 * r}" y2="${-40 * r}"/><line x1="0" y1="0" x2="${70 * r}" y2="${-40 * r}"/><line x1="0" y1="0" x2="0" y2="${78 * r}"/></g>
    <circle r="${34 * r}" fill="${G}"/><circle cx="${-70 * r}" cy="${-40 * r}" r="${20 * r}" fill="${O}"/>
    <circle cx="${70 * r}" cy="${-40 * r}" r="${20 * r}" fill="${O}"/><circle cy="${78 * r}" r="${20 * r}" fill="${WH}"/>
    <circle cx="${-10 * r}" cy="${-10 * r}" r="${9 * r}" fill="#fff" opacity=".7"/>`;
}
function hexRing(r = 1) {
  let pts = [];
  for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i - Math.PI / 2; pts.push([Math.cos(a) * 60 * r, Math.sin(a) * 60 * r]); }
  return `<polygon points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${G}" stroke-width="${7 * r}"/>
    <circle r="${26 * r}" fill="none" stroke="${G}" stroke-opacity=".6" stroke-width="${5 * r}"/>` +
    pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${12 * r}" fill="${O}"/>`).join("");
}

/* ===================== BACKGROUND (canvas) ===================== */
const bg = $("#bg").getContext("2d");
const parts = Array.from({ length: 70 }, (_, i) => {
  const r = s => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
  return { x: r(1) * W, y: r(2) * H, s: 1 + r(3) * 4, v: 10 + r(4) * 40, ph: r(5) * 6.28, z: .2 + r(6) * .8, o: r(7) < .2 };
});
function drawBG(t, cam) {
  const g = bg.createRadialGradient(540, 820, 80, 540, 960, 1250);
  g.addColorStop(0, "#123067"); g.addColorStop(.45, "#0A1D45"); g.addColorStop(1, "#040B1E");
  bg.fillStyle = g; bg.fillRect(0, 0, W, H);
  // hexagonal lattice with camera parallax
  const s = 70 * (0.6 + cam.z * 0.4), hw = s * Math.sqrt(3);
  const ox = ((-cam.x * .18 * cam.z) % hw + hw) % hw, oy = ((-cam.y * .18 * cam.z) % (s * 3) + s * 3) % (s * 3);
  bg.strokeStyle = "rgba(140,245,176,0.055)"; bg.lineWidth = 2;
  bg.beginPath();
  for (let row = -2; row < H / (s * 1.5) + 2; row++) for (let col = -2; col < W / hw + 2; col++) {
    const cx = col * hw + (row % 2 ? hw / 2 : 0) + ox, cy = row * s * 1.5 + oy;
    for (let k = 0; k < 6; k++) {
      const a = Math.PI / 3 * k + Math.PI / 6, b = a + Math.PI / 3;
      bg.moveTo(cx + Math.cos(a) * s, cy + Math.sin(a) * s); bg.lineTo(cx + Math.cos(b) * s, cy + Math.sin(b) * s);
    }
  }
  bg.stroke();
  // floating particles (bokeh)
  for (const p of parts) {
    const x = ((p.x - cam.x * .3 * p.z + Math.sin(t * .6 + p.ph) * 30) % W + W) % W;
    const y = ((p.y - t * p.v - cam.y * .3 * p.z) % H + H) % H;
    bg.beginPath(); bg.arc(x, y, p.s * (1 + p.z), 0, 6.283);
    bg.fillStyle = p.o ? `rgba(255,154,60,${.25 * p.z})` : `rgba(140,245,176,${.28 * p.z})`; bg.fill();
  }
}

/* ===================== CAMERA ===================== */
// keyframes: [time, worldX, worldY, zoom, rotationDeg]
const S2Y = 2400, S3Y = 4800, S4X = -2400, S4Y = 7200;
const CAM = [
  [0.0, 540, 660, 1.22, -3], [3.5, 540, 720, 1.1, 0], [4.7, 540, 900, 1.0, 0], [9.55, 540, 900, 1.06, 0],
  [10.45, 540, S2Y + 470, 1.1, 0], [17.7, 540, S2Y + 520, 1.1, 0],
  [18.8, 540, S2Y + 1090, 0.9, 0], [25.6, 540, S2Y + 1110, 0.92, 0], [26.6, 540, S2Y + 1540, 1.0, 0], [29.55, 540, S2Y + 1560, 1.03, 0],
  [30.55, -660, S3Y + 900, 0.30, 0], [33.15, -660, S3Y + 900, 0.32, 0],
  [33.95, 540, S3Y + 900, 1.0, 0], [38.95, 540, S3Y + 900, 1.04, 0],
  [39.75, -660, S3Y + 900, 1.0, 0], [44.35, -660, S3Y + 900, 1.04, 0],
  [45.15, -1860, S3Y + 900, 1.0, 0], [49.6, -1860, S3Y + 900, 1.05, 0],
  [50.45, S4X + 540, S4Y + 900, 1.0, 0], [54.0, S4X + 540, S4Y + 900, 1.1, 0],
  [54.85, S4X + 540, S4Y + 1920 + 960, 1.0, 0], [60.0, S4X + 540, S4Y + 1920 + 960, 1.05, 0],
];
let track = []; // word-tracking targets for scene 2: {t, x, y}
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && t >= CAM[i + 1][0]) i++;
  const a = CAM[i], b = CAM[i + 1], k = E.io(prog(t, a[0], b[0]));
  const c = { x: lerp(a[1], b[1], k), y: lerp(a[2], b[2], k), z: Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), k)), r: lerp(a[4], b[4], k) };
  // "follow the words": camera glides toward the word currently being spoken
  if (track.length) {
    const w = prog(t, 11.9, 12.5) * (1 - prog(t, 17.4, 18.4));
    if (w > 0) {
      let p = { x: 540, y: S2Y + 470 };
      for (let j = 0; j < track.length; j++) {
        const q = track[j], prev = j ? track[j - 1] : p;
        const kk = E.io(prog(t, q.t - .15, q.t + .45));
        if (t >= q.t - .15) p = { x: lerp(prev.x, q.x, kk), y: lerp(prev.y, q.y, kk) };
      }
      c.x += (p.x - 540) * .2 * w; c.y += (p.y - (S2Y + 470)) * .5 * w;
    }
  }
  // gentle hand-held drift
  c.x += Math.sin(t * .7) * 6; c.y += Math.cos(t * .53) * 6;
  return c;
}
function applyCam(t) {
  const c = camAt(t), p = camAt(t - 1 / 30);
  const v = Math.hypot((c.x - p.x) * c.z, (c.y - p.y) * c.z) + Math.abs(Math.log(c.z / p.z)) * 900;
  const wd = $("#world");
  wd.style.transform = `translate(540px,960px) rotate(${c.r}deg) scale(${c.z}) translate(${-c.x}px,${-c.y}px)`;
  wd.style.filter = v > 6 ? `blur(${Math.min(9, (v - 6) * .09)}px)` : "none";
  return c;
}

/* ===================== SCENE 1 — Opening (0–10 s) ===================== */
function scene1() {
  const g = group(0, 0);
  // floating molecules
  const mols = [[170, 300, .9, 0.4], [900, 380, .75, 0.6], [140, 1480, .7, 0.8], [930, 1560, 1, 0.5], [880, 900, .55, 1.0], [200, 920, .5, 1.1]];
  mols.forEach(([x, y, s, d], i) => {
    const m = svg(g, 220, 220, `<g transform="translate(110,110)">${i % 2 ? hexRing(s) : molecule(s)}</g>`, `left:${x - 110}px;top:${y - 110}px`);
    on(t => {
      const k = E.back(prog(t, d, d + .8));
      m.style.opacity = prog(t, d, d + .5) * (1 - prog(t, 9.4, 10)) * .9;
      setT(m, `translate(${Math.sin(t * .8 + i) * 22}px,${Math.cos(t * .6 + i * 2) * 26}px) rotate(${t * (i % 2 ? 22 : -18) + i * 40}deg) scale(${k})`);
    });
  });
  // logo: hexagon frame drawing + flask + orbiting electrons
  const logo = svg(g, 560, 560, `
    <defs><radialGradient id="lg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${G}" stop-opacity=".35"/><stop offset="1" stop-color="${G}" stop-opacity="0"/></radialGradient>
    <clipPath id="fc"><path d="M245 170 h70 v95 l85 150 q12 26 -18 26 h-204 q-30 0 -18 -26 l85 -150z"/></clipPath></defs>
    <circle cx="280" cy="280" r="270" fill="url(#lg)"/>
    <polygon id="hex" points="280,30 497,155 497,405 280,530 63,405 63,155" fill="rgba(7,22,52,.6)" stroke="${G}" stroke-width="12" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <polygon id="hex2" points="280,62 469,171 469,389 280,498 91,389 91,171" fill="none" stroke="${O}" stroke-width="4" stroke-opacity=".8" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <g clip-path="url(#fc)"><rect id="liq" x="150" y="440" width="260" height="300" fill="${G2}"/>
      <path id="wave" fill="${G}" d=""/>
      <g id="bub"></g></g>
    <path id="flask" d="M245 170 h70 v95 l85 150 q12 26 -18 26 h-204 q-30 0 -18 -26 l85 -150z" fill="none" stroke="${WH}" stroke-width="10" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <rect x="232" y="152" width="96" height="22" rx="8" fill="${WH}" id="cap"/>
    <g id="orb" transform="translate(280,280)">
      <ellipse rx="230" ry="80" fill="none" stroke="${G}" stroke-opacity=".5" stroke-width="3" transform="rotate(-30)"/>
      <ellipse rx="230" ry="80" fill="none" stroke="${O}" stroke-opacity=".5" stroke-width="3" transform="rotate(30)"/>
      <circle id="e1" r="16" fill="${G}"/><circle id="e2" r="16" fill="${O}"/></g>`, "left:260px;top:340px");
  const q = s => logo.querySelector(s);
  const bub = q("#bub");
  for (let i = 0; i < 9; i++) bub.appendChild(document.createElementNS(NS, "circle"));
  on(t => {
    const show = prog(t, .15, .6);
    logo.style.opacity = show * (1 - prog(t, 9.55, 10.1));
    setT(logo, `scale(${lerp(.6, 1, E.back(prog(t, .15, 1.1)))}) rotate(${(1 - E.out(prog(t, .15, 1.6))) * -60}deg)`);
    q("#hex").setAttribute("stroke-dashoffset", 1 - E.io(prog(t, .2, 1.5)));
    q("#hex2").setAttribute("stroke-dashoffset", 1 - E.io(prog(t, .6, 1.9)));
    q("#flask").setAttribute("stroke-dashoffset", 1 - E.io(prog(t, .7, 1.9)));
    q("#cap").setAttribute("opacity", prog(t, 1.6, 1.9));
    const lvl = lerp(440, 300, E.out(prog(t, 1.5, 3)));
    q("#liq").setAttribute("y", lvl + 10);
    let d = `M150 ${lvl + 12}`;
    for (let x = 150; x <= 410; x += 10) d += ` L${x} ${lvl + Math.sin(x * .05 + t * 5) * 7}`;
    q("#wave").setAttribute("d", d + " L410 460 L150 460Z");
    [...bub.children].forEach((c, i) => {
      const ph = ((t * .7 + i * .37) % 1);
      c.setAttribute("cx", 200 + (i * 53) % 160 + Math.sin(t * 4 + i) * 6); c.setAttribute("cy", 440 - ph * 150);
      c.setAttribute("r", 5 + (i % 3) * 3); c.setAttribute("fill", WH); c.setAttribute("opacity", prog(t, 1.8, 2.4) * (1 - ph) * .8);
    });
    const ek = prog(t, 1.2, 1.9);
    [["#e1", -30, 0], ["#e2", 30, 3.14]].forEach(([id, rot, ph]) => {
      const a = t * 2.4 + ph, x = Math.cos(a) * 230, y = Math.sin(a) * 80, r = rot * Math.PI / 180;
      const e = q(id); e.setAttribute("cx", x * Math.cos(r) - y * Math.sin(r)); e.setAttribute("cy", x * Math.sin(r) + y * Math.cos(r)); e.setAttribute("opacity", ek);
    });
    q("#orb").setAttribute("opacity", ek);
  });
  // hook question (0.7–3.9 s)
  const qn = words(g, "كيف تُصنع الأشياء من حولك؟", [C("s1", 3), C("s1", 4), C("s1", 5), C("s1", 6), C("s1", 7)], { x: 540, y: 975, size: 62, weight: 800, color: "#EAF6FF" });
  const qm = qn.spans[4]; qm.innerHTML = "حولك<span style='color:#FF9A3C'>؟</span>";
  on(t => { const k = E.io(prog(t, 3.8, 4.4)); qn.style.opacity = 1 - k; qn.style.transform = `translate(-50%,-50%) translateY(${-k * 80}px)`; });
  const hi = words(g, "أهلاً بكم في", [C("s1", 8), C("s1", 9), C("s1", 10)], { x: 540, y: 985, size: 56, weight: 600, color: "#EAF6FF" });
  hi.style.opacity = .85;
  // main title
  const ttl = words(g, "الكيمياء الصناعية", [C("s1", 12), C("s1", 13)], { x: 540, y: 1110, size: 104, weight: 900, cls: "glow" });
  const sub1 = words(g, "سرُّ حياتنا اليومية", [C("s1", 14), C("s1", 15), C("s1", 16)], { x: 540, y: 1300, size: 76, weight: 800 });
  // underline sweep + orange spark
  const ul = el("div", { class: "abs", style: "left:540px;top:1200px;height:10px;border-radius:5px;background:linear-gradient(90deg,#FF9A3C,#8CF5B0);box-shadow:0 0 22px #8CF5B0" }, g);
  on(t => { const k = E.io(prog(t, C("s1", 13) + .2, C("s1", 13) + 1)); ul.style.width = k * 560 + "px"; ul.style.transform = "translateX(-50%)"; });
  const tag = el("div", { class: "abs chip orange", style: "left:540px;top:1430px;font-size:44px" }, g, "⚗️ حلقة اليوم");
  tag.innerHTML = `<svg width="40" height="40" viewBox="0 0 40 40"><path d="M14 4h12M16 4v11L6 33q-2 4 3 4h22q5 0 3-4L24 15V4" fill="none" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/></svg> رحلة في عالم المصانع`;
  pop(tag, C("s1", 16) + .85, "translate(-50%,-50%)");
  on(t => { g.style.opacity = 1 - prog(t, 9.5, 10.05); g.style.display = t > 10.6 ? "none" : "block"; });
}

/* ===================== SCENE 2 — Definition + factory (10–30 s) ===================== */
function rawIcon(kind) {
  if (kind === "oil") return `<rect x="45" y="30" width="110" height="150" rx="18" fill="${NB}" stroke="${G}" stroke-width="7"/>
    <line x1="45" y1="75" x2="155" y2="75" stroke="${G}" stroke-width="6"/><line x1="45" y1="135" x2="155" y2="135" stroke="${G}" stroke-width="6"/>

    }
    words(cg, d.title, [C(d.id, d.ti)], { x: 540, y: 990, size: 124, weight: 900, cls: "glow" });
    words(cg, d.sub, d.si.map(j => C(d.id, j)), { x: 540, y: 1140, size: 70, weight: 700, color: "#EAF6FF" });
    const detParts = d.det.split(" ");
    words(cg, d.det, detParts.map((_, j) => C(d.id, d.di[Math.min(j, d.di.length - 1)])), { x: 540, y: 1262, size: 44, weight: 600, color: "rgba(140,245,176,.85)" });
  });
  on(t => { g.style.display = t < 29.4 || t > 50.8 ? "none" : "block"; g.style.opacity = prog(t, 29.5, 30.1) * (1 - prog(t, 50.0, 50.5)); });
  // screen-space header for scene 3
  const hd = $("#s3head");
  hd.style.cssText = "left:0;top:0;width:1080px;height:1920px";
  const big = words(hd, "أمثلة من حياتنا اليومية", [2, 3, 4, 5].map(i => C("s3a", i)), { x: 540, y: 470, size: 92, weight: 900, cls: "glow" });
  const small = el("div", { class: "abs txt", style: "left:540px;top:150px;font-size:50px;font-weight:800;color:#EAF6FF;transform:translate(-50%,-50%)" }, hd, "أمثلة يومية");
  const dots = el("div", { class: "abs", style: "left:540px;top:1648px;transform:translate(-50%,-50%);display:flex;gap:26px" }, hd);
  const dd = [0, 1, 2].map(() => el("div", { style: "height:22px;border-radius:11px" }, dots));
  on(t => {
    const vis = prog(t, 30.2, 30.5) * (1 - prog(t, 49.8, 50.3));
    hd.style.opacity = vis; hd.style.display = vis > 0 ? "block" : "none";
    const m = E.io(prog(t, 33.2, 33.9));
    big.style.opacity = 1 - m; big.style.transform = `translate(-50%,-50%) translateY(${-m * 120}px) scale(${1 - m * .3})`;
    small.style.opacity = m * .9;
    dots.style.opacity = m;
    const act = t < 39.2 ? 0 : t < 44.6 ? 1 : 2;
    dd.forEach((e, j) => { e.style.width = (j === act ? 70 : 22) + "px"; e.style.background = j === act ? "#FF9A3C" : j < act ? "#8CF5B0" : "rgba(140,245,176,.3)"; e.style.transition = "none"; });
  });
}

/* ===================== SCENE 4 — Closing + end screen (50–60 s) ===================== */
function scene4() {
  const g = group(S4X, S4Y);
  const tag = el("div", { class: "abs chip orange", style: "left:540px;top:300px;font-size:46px" }, g,
    `<svg width="38" height="38" viewBox="0 0 38 38"><path d="M19 3 L36 33 H2Z" fill="none" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/><line x1="19" y1="14" x2="19" y2="23" stroke="${O}" stroke-width="4" stroke-linecap="round"/><circle cx="19" cy="28" r="2.5" fill="${O}"/></svg> تذكَّر دائماً`);
  pop(tag, C("s4a", 0), "translate(-50%,-50%)");
  // doors of the future
  const door = el("div", { class: "abs", style: "left:290px;top:430px;width:500px;height:640px;perspective:1400px" }, g);
  const rays = svg(door, 500, 640, `<defs><radialGradient id="dl" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#FFF6D8"/><stop offset=".4" stop-color="${G}" stop-opacity=".85"/><stop offset="1" stop-color="${G}" stop-opacity="0"/></radialGradient></defs>
    <g id="rays" transform="translate(250,340)">${Array.from({ length: 14 }, (_, i) => `<polygon points="-18,0 18,0 0,-620" fill="${i % 2 ? G : O}" opacity=".35" transform="rotate(${i * 360 / 14})"/>`).join("")}</g>
    <rect x="30" y="30" width="440" height="600" rx="20" fill="url(#dl)"/>
    <g id="atom" transform="translate(250,330)"><circle r="34" fill="${O}"/>${[0, 60, 120].map(r => `<ellipse rx="120" ry="42" fill="none" stroke="${NV}" stroke-width="7" transform="rotate(${r})"/>`).join("")}</g>`, "left:0;top:0");
  const frame = el("div", { class: "abs", style: "left:0;top:0;width:500px;height:640px;border:14px solid #8CF5B0;border-bottom:none;border-radius:24px 24px 0 0;box-shadow:0 0 40px rgba(140,245,176,.5)" }, door);
  const panels = [0, 1].map(i => {
    const p = el("div", { class: "abs", style: `top:14px;${i ? "right" : "left"}:14px;width:236px;height:626px;background:linear-gradient(180deg,#1D4A97,#0C2452);border:5px solid #8CF5B0;transform-origin:${i ? "right" : "left"} center` }, door);
    el("div", { class: "abs", style: `top:290px;${i ? "left" : "right"}:22px;width:16px;height:70px;border-radius:8px;background:#FF9A3C` }, p);
    el("div", { class: "abs", style: "left:30px;top:40px;right:30px;height:200px;border:4px solid rgba(140,245,176,.4);border-radius:10px" }, p);
    el("div", { class: "abs", style: "left:30px;top:390px;right:30px;height:200px;border:4px solid rgba(140,245,176,.4);border-radius:10px" }, p);
    return p;
  });
  const dOpen = C("s4a", 5);
  pop(door, C("s4a", 0) + .1, "", .7);
  on(t => {
    const k = E.io(prog(t, dOpen - .1, dOpen + 1.1));
    panels[0].style.transform = `rotateY(${k * 105}deg)`; panels[1].style.transform = `rotateY(${-k * 105}deg)`;
    rays.style.opacity = prog(t, dOpen - .1, dOpen + .4);
    rays.querySelector("#rays").setAttribute("transform", `translate(250,340) rotate(${t * 20}) scale(${lerp(.4, 1, k)})`);
    rays.querySelector("#atom").setAttribute("transform", `translate(250,330) rotate(${t * 60}) scale(${E.back(prog(t, dOpen + .3, dOpen + 1))})`);
  });
  words(g, "تعلَّم الكيمياء", [C("s4a", 2), C("s4a", 3)], { x: 540, y: 1185, size: 110, weight: 900, cls: "glow" });
  const l2 = words(g, "يفتح أبواب المستقبل", [C("s4a", 4), C("s4a", 5), C("s4a", 6)], { x: 540, y: 1330, size: 92, weight: 900 });
  l2.spans[2].classList.add("oglow");

  // ---- END SCREEN (local y 1920..3840) ----
  const E0 = 1920;
  const logo = svg(g, 300, 300, `<g transform="translate(150,150) scale(1.9)">${hexRing(1)}</g>`, `left:390px;top:${E0 + 300}px`);
  on(t => { const k = prog(t, 54.2, 55); logo.style.opacity = k; setT(logo, `scale(${E.back(k)}) rotate(${t * 15}deg)`); });
  const nm = words(g, "الكيمياء الصناعية", 54.6, { x: 540, y: E0 + 690, size: 80, weight: 900, cls: "glow", stagger: .12 });
  const f1 = words(g, "تابعنا للمزيد من المعلومات", [0, 1, 2, 3].map(i => C("s4b", i)), { x: 540, y: E0 + 850, size: 74, weight: 800, color: "#EAF6FF" });
  // follow button
  const btn = el("div", { class: "abs", style: `left:540px;top:${E0 + 1060}px;width:560px;height:150px;border-radius:75px;display:flex;align-items:center;justify-content:center;gap:22px;font-size:64px;font-weight:900;white-space:nowrap` }, g);
  const ripple = el("div", { class: "abs", style: `left:540px;top:${E0 + 1060}px;width:560px;height:150px;border-radius:75px;border:6px solid #FF9A3C` }, g);
  const hand = svg(g, 140, 170, `<path d="M52 10 q14 0 14 14 v52 l6 -2 q12 -3 16 8 l2 4 q10 -6 18 4 q10 -4 16 6 l8 40 q4 30 -14 46 h-58 q-10 -12 -24 -40 l-22 -40 q-6 -14 6 -18 q10 -2 18 10 v-70 q0 -14 14 -14z" fill="#EAF6FF" stroke="${NV}" stroke-width="6" stroke-linejoin="round"/>`, `left:0;top:0`);
  const tapT = C("s4b", 8) + .05;
  on(t => {
    const k = prog(t, C("s4b", 6) - .9, C("s4b", 6) - .3);
    const done = t >= tapT + .15;
    btn.style.opacity = k;
    const press = t > tapT - .1 && t < tapT + .25 ? .92 : 1;
    const breathe = done ? 1 + Math.sin((t - tapT) * 5) * .025 : 1 + Math.sin(t * 6) * .03;
    btn.style.transform = `translate(-50%,-50%) scale(${E.back(k) * press * breathe})`;
    btn.style.background = done ? "linear-gradient(90deg,#4FE38A,#8CF5B0)" : "linear-gradient(90deg,#FF7A1A,#FF9A3C)";
    btn.style.color = "#071634";
    btn.style.boxShadow = done ? "0 0 60px rgba(140,245,176,.7)" : `0 0 ${50 + Math.sin(t * 6) * 20}px rgba(255,154,60,.75)`;
    btn.innerHTML = done
      ? `<svg width="60" height="60" viewBox="0 0 60 60"><path d="M10 32 l13 13 l27 -30" fill="none" stroke="#071634" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>تمت المتابعة`
      : `<svg width="60" height="60" viewBox="0 0 60 60"><path d="M30 10 v40 M10 30 h40" stroke="#071634" stroke-width="10" stroke-linecap="round"/></svg>متابعة`;
    const rk = prog(t, tapT, tapT + .9);
    ripple.style.opacity = rk > 0 && rk < 1 ? (1 - rk) : 0;
    ripple.style.transform = `translate(-50%,-50%) scale(${1 + E.out(rk) * .5})`;
    ripple.style.borderColor = "#8CF5B0";
    // hand cursor: glides in, taps, leaves
    const hin = E.io(prog(t, tapT - 1.1, tapT - .2)), hout = E.io(prog(t, tapT + .6, tapT + 1.4));
    const hx = lerp(900, 600, hin) + hout * 300, hy = lerp(E0 + 1450, E0 + 1085, hin) + hout * 300;
    hand.style.opacity = hin * (1 - hout);
    setT(hand, `translate(${hx - 60}px,${hy - 10}px) scale(${press < 1 ? .9 : 1}) rotate(-12deg)`);
  });
  // confetti molecules on follow
  const conf = svg(g, 1080, 900, Array.from({ length: 22 }, (_, i) => `<circle class="cf" r="${8 + (i % 4) * 4}" fill="${i % 3 ? G : O}"/>`).join(""), `left:0;top:${E0 + 620}px`);
  on(t => {
    conf.querySelectorAll(".cf").forEach((c, i) => {
      const k = prog(t, tapT + .1, tapT + 2.2), a = i / 22 * Math.PI * 2 + i * .3, r = E.outQ(k) * (260 + (i % 5) * 70);
      c.setAttribute("cx", 540 + Math.cos(a) * r * 1.3); c.setAttribute("cy", 440 + Math.sin(a) * r + k * k * 160);
      c.setAttribute("opacity", k > 0 ? (1 - k) : 0);
    });
  });
  const hint = words(g, "حلقات جديدة كل أسبوع", 57.8, { x: 540, y: E0 + 1290, size: 46, weight: 700, color: "rgba(140,245,176,.8)", stagger: .1 });
  on(t => { g.style.display = t < 49.6 ? "none" : "block"; g.style.opacity = prog(t, 49.7, 50.3); });
}

/* ===================== OVERLAY: transitions, captions, progress ===================== */
const burst = $("#burst");
const BURSTS = [10.0, 30.0, 50.0];
for (let i = 0; i < 3 * 16; i++) { const c = document.createElementNS(NS, "circle"); burst.appendChild(c); }
function drawOverlay(t) {
  // molecular burst + flash at scene boundaries
  let fl = 0;
  BURSTS.forEach((b, bi) => {
    const k = prog(t, b - .35, b + .55);
    fl = Math.max(fl, k > 0 && k < 1 ? Math.sin(k * Math.PI) * .55 : 0);
    for (let j = 0; j < 16; j++) {
      const c = burst.children[bi * 16 + j], a = j / 16 * Math.PI * 2 + bi, r = E.out(k) * (500 + (j % 3) * 160);
      c.setAttribute("cx", 540 + Math.cos(a) * r); c.setAttribute("cy", 960 + Math.sin(a) * r);
      c.setAttribute("r", (10 + (j % 4) * 6) * (1 - k * .6)); c.setAttribute("fill", j % 3 ? G : O);
      c.setAttribute("opacity", k > 0 && k < 1 ? (1 - k) * .9 : 0);
    }
  });
  $("#flash").style.opacity = fl;
  $("#progress").style.width = (t / 60 * 1080) + "px";
  // karaoke captions: pages of up to 5 words, current word highlighted
  const cap = $("#caption");
  let html = "", show = 0;
  for (const id in TL.chunks) {
    const ch = TL.chunks[id];
    if (t < ch.start - .15 || t > ch.end + .35) continue;
    const ws = ch.words, pages = [];
    for (let i = 0; i < ws.length; i += 5) pages.push([i, Math.min(ws.length, i + 5)]);
    if (pages.length > 1 && pages[pages.length - 1][1] - pages[pages.length - 1][0] < 3) { const l = pages.pop(); pages[pages.length - 1][1] = l[1]; }
    let cur = 0; ws.forEach((w, i) => { if (t >= w.t - .05) cur = i; });
    const pg = pages.find(p => cur >= p[0] && cur < p[1]);
    for (let i = pg[0]; i < pg[1]; i++) html += `<span class="cw ${i === cur && t <= ws[i].t + ws[i].d + .25 ? "on" : ""}">${ws[i].w}</span>`;
    show = prog(t, ch.start - .15, ch.start + .05) * (1 - prog(t, ch.end + .15, ch.end + .35));
  }
  if (cap._h !== html) { cap.innerHTML = html; cap._h = html; }
  cap.style.opacity = show;
  cap.style.display = show > 0 ? "block" : "none";
}

/* ===================== BUILD + RENDER ===================== */
scene1();
const s2 = scene2();
scene3();
scene4();
// compute word-tracking targets for scene 2 from the real word layout
function buildTrack() {
  track = [];
  [s2.l1, s2.l2].forEach(box => box.spans.forEach((s, i) => {
    const bx = box.offsetLeft - box.offsetWidth / 2, by = box.offsetTop - box.offsetHeight / 2;
    track.push({ t: box.times[i], x: bx + s.offsetLeft + s.offsetWidth / 2, y: S2Y + by + s.offsetTop + s.offsetHeight / 2 });
  }));
}
window.render = function (t) {
  if (!track.length) buildTrack();
  const cam = applyCam(t);
  drawBG(t, cam);
  for (const f of anims) f(t);
  drawOverlay(t);
};
window.ready = document.fonts.ready.then(() => { buildTrack(); window.render(0); return true; });
</script>
